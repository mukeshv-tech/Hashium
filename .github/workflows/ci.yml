name: CI & Portability

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  rust-checks:
    name: Rust Core Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Format Check
        run: cargo fmt --check --manifest-path native/hca-core/Cargo.toml

      - name: Cargo Clippy Check
        run: cargo clippy --manifest-path native/hca-core/Cargo.toml -- -D warnings

      - name: Cargo Tests
        run: cargo test --manifest-path native/hca-core/Cargo.toml

  python-tests:
    name: Python Matrix (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Maturin and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest hypothesis pycryptodome argon2-cffi psutil

      - name: Build and Install Wheel
        run: |
          maturin build --release --manifest-path native/hca-core/Cargo.toml --out dist
          pip install --find-links=dist hca-core

      - name: Run Test Suites
        run: |
          pytest tests/ -v
